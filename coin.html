<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>กราฟเหรียญ · เรดาร์คริปโต</title>
<meta name="theme-color" content="#0b1016">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/app.css">
<style>
.wrap { max-width: 1300px; margin: 0 auto; padding: 16px clamp(12px, 1.5vw, 28px) 24px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 14px; }
.card h2 { margin: 0 0 10px; font-size: 16px; }
.muted { color: var(--muted); font-size: 13px; }
.search { display: flex; gap: 8px; }
.search input { flex: 1; min-width: 0; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); color: var(--fg); font: inherit; }
.search button, .ranges button { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); color: var(--fg); font: inherit; cursor: pointer; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chips button { border: 1px solid var(--line); background: var(--panel2); color: var(--fg); border-radius: 999px; padding: 4px 11px; font: inherit; font-size: 13px; cursor: pointer; }
.chips button.on { border-color: var(--teal); color: var(--teal); }
.chips .grp { width: 100%; color: var(--muted); font-size: 12px; margin-top: 4px; }
.results button { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--fg); padding: 8px 4px; font: inherit; cursor: pointer; }
.hd { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.hd img { width: 36px; height: 36px; border-radius: 50%; }
.hd h1 { margin: 0; font-size: 20px; }
.hd .px { margin-left: auto; text-align: right; }
.hd .px b { font-size: 24px; font-variant-numeric: tabular-nums; display: block; }
.pos { color: #34d399; } .neg { color: #f87171; }
.ranges { display: flex; gap: 6px; margin: 12px 0 6px; }
.ranges button.on { border-color: var(--teal); color: var(--teal); }
#chart { position: relative; min-height: 260px; }
#chart svg { display: block; }
.tip { position: absolute; pointer-events: none; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 12px; white-space: nowrap; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat { background: var(--panel2); border-radius: 10px; padding: 10px 12px; }
.stat span { display: block; color: var(--muted); font-size: 12px; }
.stat b { font-variant-numeric: tabular-nums; }
.an ul { margin: 6px 0; padding-left: 20px; }
.an li { margin: 4px 0; }
.badge { display: inline-block; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 600; margin-right: 6px; }
.b-up { background: #0f3b2c; color: #34d399; } .b-down { background: #3b1414; color: #f87171; } .b-side { background: #2c2a12; color: #fbbf24; }
.meter { display: inline-flex; gap: 3px; vertical-align: middle; } .meter i { width: 14px; height: 8px; border-radius: 2px; background: var(--line); } .meter i.f { background: #f87171; }
.note { border-left: 3px solid #fbbf24; background: var(--panel2); padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-top: 10px; }
.empty { color: var(--muted); padding: 30px 0; text-align: center; }
</style>
</head>
<body>
<header class="app-bar">
  <a class="brand" href="./"><img src="icons/icon-192.png" alt=""><span>เรดาร์คริปโต</span></a>
  <nav class="tabs">
    <a href="./">แดชบอร์ด</a>
    <a href="portfolio.html">พอร์ต</a>
    <a href="coin.html" class="on">กราฟ</a>
    <a href="guide.html">คู่มือ</a>
  </nav>
  <span class="updated" id="updated"></span>
  <button class="refresh" id="refresh" type="button" title="เช็กเวอร์ชันใหม่และดึงข้อมูลล่าสุด">↻<span class="t"> อัปเดต</span></button>
  <button class="install" id="install" hidden>ติดตั้งแอป</button>
</header>

<div class="wrap">
  <div class="card">
    <div class="search">
      <input id="q" placeholder="ค้นหาเหรียญ เช่น BTC, SAND, Solana" autocomplete="off" spellcheck="false">
      <button id="q-go" type="button">ค้นหา</button>
    </div>
    <div class="results" id="results"></div>
    <div class="chips" id="chips"></div>
  </div>

  <div id="coin"><div class="card empty">เลือกเหรียญด้านบนเพื่อดูกราฟและบทวิเคราะห์</div></div>

  <p class="muted" style="margin-top:14px">ราคาและกราฟจาก CoinGecko (สำรองด้วย Binance) บทวิเคราะห์เป็นข้อมูลเพื่อการศึกษา ไม่ใช่คำแนะนำการลงทุน</p>
</div>

<footer class="app-foot">ข้อมูลเพื่อการศึกษา ไม่ใช่คำแนะนำการลงทุน · แอปนี้ไม่รับฝากเงินและไม่เชื่อมกระเป๋า</footer>

<script src="js/app.js"></script>
<script src="vendor/d3.min.js"></script>
<script src="js/coins.js"></script>
<script src="js/telegram.js"></script>
<script src="js/alerts.js"></script>
<script src="js/coin.js"></script>
</body>
</html>
