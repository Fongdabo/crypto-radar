name: diag wallet endpoints
on:
  push:
    branches: ['diag/**']
    paths: ['scripts/diag-endpoints.mjs', '.github/workflows/diag.yml']
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/diag-endpoints.mjs > diag-out.txt 2>&1 || true
      - run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add diag-out.txt && git commit -m "diag output" && git push
