name: Telegram morning digest
on:
  # Paused at the user's request; restore the schedule to turn the morning digest back on.
  # schedule:
  #   - cron: '35 0 * * *'   # 07:35 Bangkok, after the 07:17 data sync
  workflow_dispatch:
permissions:
  contents: read
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/telegram-digest.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
